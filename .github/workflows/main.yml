name: main

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  codebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::235494787236:role/go-api-github-oidc
          aws-region: ap-southeast-2

      - name: Upload source and start CodeBuild
        env:
          SOURCE_BUCKET: go-api-ci-source-235494787236
        run: |
          set -euo pipefail
          key="source/${GITHUB_SHA}.zip"
          git archive --format=zip --output source.zip HEAD
          aws s3 cp source.zip "s3://${SOURCE_BUCKET}/${key}"
          build_id="$(aws codebuild start-build \
            --project-name go-api-ci \
            --source-location-override "${SOURCE_BUCKET}/${key}" \
            --environment-variables-override \
              "[{\"name\":\"IMAGE_REPO_NAME\",\"value\":\"go-api\",\"type\":\"PLAINTEXT\"},{\"name\":\"AWS_ACCOUNT_ID\",\"value\":\"357278306946\",\"type\":\"PLAINTEXT\"},{\"name\":\"DEPLOY_ROLE_ARN\",\"value\":\"arn:aws:iam::357278306946:role/go-api-github-deploy\",\"type\":\"PLAINTEXT\"},{\"name\":\"IMAGE_TAG\",\"value\":\"${GITHUB_SHA}\",\"type\":\"PLAINTEXT\"}]" \
            --query 'build.id' \
            --output text)"
          echo "CodeBuild ${build_id}"
          while true; do
            status="$(aws codebuild batch-get-builds \
              --ids "${build_id}" \
              --query 'builds[0].buildStatus' \
              --output text)"
            echo "status=${status}"
            case "${status}" in
              SUCCEEDED) exit 0 ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) exit 1 ;;
            esac
            sleep 20
          done
